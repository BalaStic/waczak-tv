<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>waczak-tv</title>
    <!-- Video.js temporarily disabled in favor of native playback.
    <link rel="stylesheet" href="https://vjs.zencdn.net/8.23.4/video-js.css">
    <script src="https://vjs.zencdn.net/8.23.4/video.min.js" defer></script>
    -->
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="player-shell">
      <header class="channel-header">
        <div>
          <p class="eyebrow">LOCAL CHANNEL</p>
          <h1>waczak-tv</h1>
        </div>
        <p id="channel-status" class="status" role="status">Connecting…</p>
      </header>

      <section class="screen" aria-label="Channel video">
        <video id="video" autoplay muted playsinline></video>
        <div id="video-message" class="video-message" role="status" hidden></div>
        <div class="video-controls" role="group" aria-label="Volume control">
          <button id="volume-button" type="button">Unmute</button>
          <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        </div>
      </section>

      <section class="now-playing" aria-live="polite">
        <div>
          <p class="eyebrow">NOW PLAYING</p>
          <p id="filename" class="filename">Waiting for the channel…</p>
        </div>
        <button id="start-button" type="button" hidden>Start playback</button>
      </section>

      <p id="error-message" class="error-message" role="alert" hidden></p>

      <!-- Video.js player temporarily disabled.
      <section class="videojs-section" aria-labelledby="videojs-heading">
        <div class="videojs-heading">
          <div>
            <p class="eyebrow">CHANNEL PLAYER</p>
            <h2 id="videojs-heading">Video.js</h2>
          </div>
          <p id="videojs-status" class="videojs-status" role="status" aria-live="polite">Waiting for the channel…</p>
        </div>
        <div class="videojs-screen">
          <video id="videojs-player" class="video-js vjs-big-play-centered" controls playsinline preload="auto"></video>
        </div>
      </section>
      -->
    </main>
  </body>
</html>
